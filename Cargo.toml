[workspace]
resolver = "2"
members = [
    "crates/pubid-core",
    "crates/pubid-cli",
    "crates/conformance",
    "crates/pubid-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pubid/pubid-rs"
authors = ["PubID contributors"]

[workspace.dependencies]
parsanol = "0.20"
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.13"
pubid-core = { path = "crates/pubid-core" }

[profile.release]
lto = true
codegen-units = 1
