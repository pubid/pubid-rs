name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + clippy + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned refs (pins.yaml is the single source)
        id: pins
        run: |
          echo "grammar_ref=$(sed -n 's/^grammar_ref: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "testsuite_ref=$(sed -n 's/^testsuite_ref: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned pubid-grammar
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref }}
          path: pubid-grammar

      - name: Checkout pinned pubid-testsuite
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ steps.pins.outputs.testsuite_ref }}
          path: pubid-testsuite

      - name: Vendored artifacts match the pinned grammar ref (drift gate)
        run: |
          for flavor in doi isbn iana oasis xsf un ogc ietf w3c api amca \
            nesc ire ansi ecma gb gost adobe plateau evs ccsds cen_cenelec \
            jis etsi doi_pfs calconnect_pfs cen_pfs etsi_pfs bsi_pfs; do
            cmp "pubid-grammar/artifacts/$flavor.json" \
                "crates/pubid-core/artifacts/$flavor.json"
          done

      - name: Vendored slices match the pinned testsuite ref (drift gate)
        run: |
          for dir in crates/pubid-core/fixtures/testsuite/*/; do
            flavor=$(basename "$dir")
            for file in "$dir"*.yaml; do
              cmp "$file" "pubid-testsuite/tests/$flavor/$(basename "$file")"
            done
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Tests (vendored artifacts + slices)
        run: cargo test

      - name: Conformance (vendored slices, every ported flavor)
        run: cargo run -q -p conformance -- --all

      - name: Conformance (pinned testsuite checkout, every ported flavor)
        run: cargo run -q -p conformance -- --testsuite pubid-testsuite/tests --all

      - name: CLI smoke
        run: |
          cargo run -q -p pubid-cli -- parse doi "doi:10.1000/182"
          cargo run -q -p pubid-cli -- parse isbn "ISBN 978-0-306-40615-7"
          cargo run -q -p pubid-cli -- parse ogc "OGC 06-121r9"
          cargo run -q -p pubid-cli -- parse ietf "draft-ietf-httpbis-messaging-19"
          cargo run -q -p pubid-cli -- smoke
