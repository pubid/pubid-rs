name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + clippy + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned refs (pins.yaml is the single source)
        id: pins
        run: |
          echo "grammar_ref=$(sed -n 's/^grammar_ref: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "grammar_ref_eu_arxiv=$(sed -n 's/^grammar_ref_eu_arxiv: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "grammar_ref_ansi=$(sed -n 's/^grammar_ref_ansi: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "grammar_ref_wmo=$(sed -n 's/^grammar_ref_wmo: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "grammar_ref_iho=$(sed -n 's/^grammar_ref_iho: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "grammar_ref_iala=$(sed -n 's/^grammar_ref_iala: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "testsuite_ref=$(sed -n 's/^testsuite_ref: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "testsuite_ref_wmo=$(sed -n 's/^testsuite_ref_wmo: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "testsuite_ref_iho=$(sed -n 's/^testsuite_ref_iho: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"
          echo "testsuite_ref_iala=$(sed -n 's/^testsuite_ref_iala: *//p' pins.yaml)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned pubid-grammar
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref }}
          path: pubid-grammar

      - name: Checkout pinned pubid-grammar (the eu/arxiv flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref_eu_arxiv }}
          path: pubid-grammar-eu-arxiv

      - name: Checkout pinned pubid-grammar (the ansi flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref_ansi }}
          path: pubid-grammar-ansi

      - name: Checkout pinned pubid-grammar (the wmo flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref_wmo }}
          path: pubid-grammar-wmo

      - name: Checkout pinned pubid-grammar (the iho flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref_iho }}
          path: pubid-grammar-iho

      - name: Checkout pinned pubid-grammar (the iala flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-grammar
          ref: ${{ steps.pins.outputs.grammar_ref_iala }}
          path: pubid-grammar-iala

      - name: Checkout pinned pubid-testsuite
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ steps.pins.outputs.testsuite_ref }}
          path: pubid-testsuite

      - name: Checkout pinned pubid-testsuite (the wmo flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ steps.pins.outputs.testsuite_ref_wmo }}
          path: pubid-testsuite-wmo

      - name: Checkout pinned pubid-testsuite (the iho flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ steps.pins.outputs.testsuite_ref_iho }}
          path: pubid-testsuite-iho

      - name: Checkout pinned pubid-testsuite (the iala flavor ref)
        uses: actions/checkout@v4
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ steps.pins.outputs.testsuite_ref_iala }}
          path: pubid-testsuite-iala

      - name: Vendored artifacts match the pinned grammar ref (drift gate)
        run: |
          for flavor in doi isbn iana oasis xsf un ogc ietf w3c api amca \
            nesc ire ecma gb gost adobe plateau evs ccsds cen_cenelec \
            jis etsi iec doi_pfs calconnect_pfs cen_pfs etsi_pfs bsi_pfs; do
            cmp "pubid-grammar/artifacts/$flavor.json" \
                "crates/pubid-core/artifacts/$flavor.json"
          done

      - name: Vendored eu/arxiv artifacts match their pinned grammar ref (drift gate)
        run: |
          # The eu/arxiv flavors postdate the grammar_ref pin, and the
          # same commits carry the open bsi_pfs rebake round - they
          # carry their own flavor-only pin (see /pins.yaml).
          for flavor in eu arxiv; do
            cmp "pubid-grammar-eu-arxiv/artifacts/$flavor.json" \
                "crates/pubid-core/artifacts/$flavor.json"
          done

      - name: Vendored ansi artifact matches its pinned grammar ref (drift gate)
        run: |
          # The ansi co-publisher rebake (grammar #139) postdates the
          # grammar_ref pin and rides with the itu flavor round and the
          # open bsi_pfs rebake - it carries its own flavor-only pin
          # (see /pins.yaml).
          cmp "pubid-grammar-ansi/artifacts/ansi.json" \
              "crates/pubid-core/artifacts/ansi.json"

      - name: Vendored wmo artifact matches its pinned grammar ref (drift gate)
        run: |
          # The wmo flavor (grammar at pubid#763) postdates the
          # grammar_ref pin - it carries its own flavor-only pin (see
          # /pins.yaml).
          cmp "pubid-grammar-wmo/artifacts/wmo.json" \
              "crates/pubid-core/artifacts/wmo.json"

      - name: Vendored iho artifact matches its pinned grammar ref (drift gate)
        run: |
          # The iho flavor (grammar_ref_iho) carries its own
          # flavor-only pin, like the eu/arxiv, ansi and wmo ones (see
          # /pins.yaml): the B/C MRN-guidance emission rebake (the
          # bathy/cb codes, grammar #149) moves the pin in the same
          # change that re-vendors the envelope.
          cmp "pubid-grammar-iho/artifacts/iho.json" \
              "crates/pubid-core/artifacts/iho.json"

      - name: Vendored iala artifact matches its pinned grammar ref (drift gate)
        run: |
          # The iala flavor (grammar_ref_iala) carries its own
          # flavor-only pin, like the eu/arxiv/ansi/wmo/iho ones (see
          # /pins.yaml): the slug + S-2xx grammar round moves the pin
          # in the same change that re-vendors the envelope.
          cmp "pubid-grammar-iala/artifacts/iala.json" \
              "crates/pubid-core/artifacts/iala.json"

      - name: Vendored slices match the pinned testsuite ref (drift gate)
        run: |
          for dir in crates/pubid-core/fixtures/testsuite/*/; do
            flavor=$(basename "$dir")
            # The ansi slice is regenerated ahead of the testsuite (the
            # reference's #760 expectations; see the fixtures
            # VENDORED_FROM.md) - fold back when the testsuite exports
            # the ANSI year round.
            [ "$flavor" = "ansi" ] && continue
            # The iho slice is a byte copy of the B/C rename round
            # (the bathymetric/capacity_building rows re-frozen onto
            # the bathy/cb expectations), which postdates the
            # testsuite_ref pin - it carries its own flavor-only gate
            # below (see the fixtures VENDORED_FROM.md).
            [ "$flavor" = "iho" ] && continue
            # The iala slice is a byte copy of the iala round freeze
            # (the #772/#777 rows), which postdates the testsuite_ref
            # pin - it carries its own flavor-only gate below (see the
            # fixtures VENDORED_FROM.md).
            [ "$flavor" = "iala" ] && continue
            for file in "$dir"*.yaml; do
              # Vendored-only flavors (e.g. ire) carry no tests/<flavor>/
              # corpus in the testsuite checkout — nothing to drift against.
              [ -f "pubid-testsuite/tests/$flavor/$(basename "$file")" ] || continue
              cmp "$file" "pubid-testsuite/tests/$flavor/$(basename "$file")"
            done
          done

      - name: Vendored wmo slice matches its pinned testsuite ref (drift gate)
        run: |
          # The wmo corpus (the #763 round freeze) postdates the
          # testsuite_ref pin and rides with the ansi re-export and the
          # new eu/arxiv corpora, which the regenerated slices do not
          # fold back yet - it carries its own flavor-only pin (see
          # /pins.yaml).
          for file in crates/pubid-core/fixtures/testsuite/wmo/*.yaml; do
            cmp "$file" "pubid-testsuite-wmo/tests/wmo/$(basename "$file")"
          done

      - name: Vendored iho slice matches its pinned testsuite ref (drift gate)
        run: |
          # The iho corpus (the B/C rename round: the bathymetric/
          # capacity_building rows re-frozen onto the bathy/cb MRN
          # expectations) postdates the testsuite_ref pin and rides
          # with the iala freeze - it carries its own flavor-only pin
          # (see /pins.yaml).
          for file in crates/pubid-core/fixtures/testsuite/iho/*.yaml; do
            cmp "$file" "pubid-testsuite-iho/tests/iho/$(basename "$file")"
          done

      - name: Vendored iala slice matches its pinned testsuite ref (drift gate)
        run: |
          # The iala corpus (the #772/#777 round freeze at pubid
          # acae7a620e95) postdates the testsuite_ref pin and the
          # generic tests/iala rows there record the pre-round corpus -
          # it carries its own flavor-only pin (see /pins.yaml).
          for file in crates/pubid-core/fixtures/testsuite/iala/*.yaml; do
            cmp "$file" "pubid-testsuite-iala/tests/iala/$(basename "$file")"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Tests (vendored artifacts + slices)
        run: cargo test

      - name: Conformance (vendored slices, every ported flavor)
        run: cargo run -q -p conformance -- --all

      - name: Conformance (pinned testsuite checkout, every ported flavor)
        run: |
          # The iho flavor is gated at its own flavor-only testsuite
          # ref (the step below): tests/iho at THIS ref carries the
          # pre-S-158-re-key rows, so the generic run skips it
          # (visible skip line, never a silent pass). The iala flavor
          # is the same shape: tests/iala at THIS ref records the
          # pre-round corpus (no publication or product_specification
          # files), so the generic run skips it too - the same shape
          # the wmo flavor gets from its dir being absent here.
          cargo run -q -p conformance -- --testsuite pubid-testsuite/tests --all --skip-flavor iho --skip-flavor iala

      - name: Conformance (wmo, the pinned testsuite flavor ref)
        run: |
          # The testsuite_ref checkout predates the wmo round, so the
          # --all run above falls back to the vendored slice for wmo;
          # this run gates the flavor against its own pinned corpus.
          cargo run -q -p conformance -- --testsuite pubid-testsuite-wmo/tests --flavor wmo

      - name: Conformance (iho, the pinned testsuite flavor ref)
        run: |
          # The testsuite_ref checkout predates the B/C rename
          # round, so the --all run above falls back to the vendored
          # slice for iho; this run gates the flavor against its own
          # pinned corpus (the renamed bathymetric/capacity_building
          # rows, unmarked pendings).
          cargo run -q -p conformance -- --testsuite pubid-testsuite-iho/tests --flavor iho

      - name: Conformance (iala, the pinned testsuite flavor ref)
        run: |
          # The testsuite_ref checkout predates the iala round freeze,
          # so the --all run above falls back to the vendored slice for
          # iala; this run gates the flavor against its own pinned
          # corpus (the #772/#777 rows, unmarked pendings).
          cargo run -q -p conformance -- --testsuite pubid-testsuite-iala/tests --flavor iala

      - name: CLI smoke
        run: |
          # The parse surface (the #23 CLI): parse/urn/detect/resolve,
          # every command once in text mode and once in JSON mode.
          cargo run -q -p pubid-cli -- parse "doi:10.1000/182" --flavor doi
          cargo run -q -p pubid-cli -- parse "doi:10.1000/182" --flavor doi --json
          cargo run -q -p pubid-cli -- parse "ISBN 978-0-306-40615-7" --flavor isbn --json
          cargo run -q -p pubid-cli -- parse "OGC 06-121r9" --flavor ogc
          cargo run -q -p pubid-cli -- parse "draft-ietf-httpbis-messaging-19" --flavor ietf
          cargo run -q -p pubid-cli -- parse "EU Regulation 1227/2011" --flavor eu
          cargo run -q -p pubid-cli -- parse "32014R2015" --flavor eu
          cargo run -q -p pubid-cli -- parse "arXiv:math.GT/0309136" --flavor arxiv
          cargo run -q -p pubid-cli -- parse "WMO-No. 8" --flavor wmo
          cargo run -q -p pubid-cli -- parse "S-411 1.2.1" --flavor wmo
          cargo run -q -p pubid-cli -- parse "IHO S-158:102 1.0.0" --flavor iho
          cargo run -q -p pubid-cli -- parse "IHO S-158 0.2.0 Part S-102" --flavor iho
          cargo run -q -p pubid-cli -- parse "IALA G1164 Ed 1.1" --flavor iala
          cargo run -q -p pubid-cli -- parse "S-201 2.0.0" --flavor iala
          cargo run -q -p pubid-cli -- parse "S-201 ANNEX B2" --flavor iala
          cargo run -q -p pubid-cli -- parse "IALA arctic-seminar-report (E)" --flavor iala
          # The URN surface, both namespace classes.
          cargo run -q -p pubid-cli -- urn "XEP 0004"
          cargo run -q -p pubid-cli -- urn "IHO B-12 2.0.3"
          cargo run -q -p pubid-cli -- urn "WMO-No. 8" --json
          # Detection and the exit-code contract.
          cargo run -q -p pubid-cli -- detect "RFC 9110" --json
          ! cargo run -q -p pubid-cli -- parse "nothing accepts this" 2>/dev/null
          ! cargo run -q -p pubid-cli -- parse "X" --flavor nosuchflavor 2>/dev/null
          # The resolver layer (the #23 mapping): the canonical URL,
          # the alternates and the attested DOI, plus the unmapped
          # exit (isbn carries no attested landing page).
          cargo run -q -p pubid-cli -- resolve "RFC 9110"
          cargo run -q -p pubid-cli -- resolve "RFC 9110" --json
          cargo run -q -p pubid-cli -- resolve "doi:10.1000/182"
          cargo run -q -p pubid-cli -- resolve "IHO S-411 2.0.0"
          cargo run -q -p pubid-cli -- resolve "EU Regulation 2016/679"
          ! cargo run -q -p pubid-cli -- resolve "ISBN 978-0-306-40615-7" 2>/dev/null
          cargo run -q -p pubid-cli -- smoke

  wasm:
    name: wasm-pack build + wasm-bindgen tests (the playground target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: The wasm-facing API (wasm-bindgen-test, node backend)
        run: |
          # The suite includes the example-set gate, so the corpus-fed
          # rows are re-parsed on the exact binary the playground
          # ships (not only on the native suite).
          wasm-pack test --node crates/pubid-wasm

      - name: The release bundle (web target, the playground artifact)
        run: |
          # The web target fetches the .wasm through the glue's own
          # init() (no bundler assumptions), so the site serves the pkg
          # as a plain static asset and the playground loads it
          # client-side with a dynamic import.
          wasm-pack build crates/pubid-wasm --target web --release

      - name: Bundle receipts (size and the shipped files)
        run: |
          du -k crates/pubid-wasm/pkg/*
          ls -la crates/pubid-wasm/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: pubid-wasm-web-${{ github.sha }}
          path: crates/pubid-wasm/pkg
          retention-days: 30

  properties:
    name: Property suite (budgeted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: properties

      - name: Property suite (parse(render(x)) == x over the mined corpus)
        run: cargo test -p pubid-core --test properties
        env:
          # The budgeted PR run; the nightly job runs the wide sweep.
          PUBID_PROPERTY_CASES: 128

  fuzz-smoke:
    name: Fuzz targets build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # cargo-fuzz spawns rustc from PATH for its target probe; pin the
      # whole job to nightly (the libFuzzer passes need -Zsanitizer).
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      # libFuzzer coverage instrumentation needs nightly; cargo-fuzz 0.13
      # builds the ASAN runtime against the musl target on Linux.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fuzz

      - name: Generate the seed corpora from the vendored slices
        run: python3 fuzz/gen_seeds.py

      - name: Build the fuzz targets
        run: cargo fuzz build

      - name: Smoke parse_flavor (every ported flavor, no panic)
        run: cargo fuzz run parse_flavor -- -max_total_time=20 -rss_limit_mb=2048

      - name: Smoke roundtrip (the closures on arbitrary input)
        run: cargo fuzz run roundtrip -- -max_total_time=20 -rss_limit_mb=2048
