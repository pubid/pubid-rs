[package]
name = "pubid-wasm"
description = "WebAssembly bindings for pubid-core: the parse/detect/URN surface for the playground"
# wasm-pack's own manifest reader cannot parse workspace inheritance (it sees
# `{ workspace = true }` maps where it expects strings) — the package fields
# are inlined on purpose; keep them in sync with [workspace.package].
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pubid/pubid-rs"
authors = ["PubID contributors"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pubid-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"
